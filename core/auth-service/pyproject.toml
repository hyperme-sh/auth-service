[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "auth-service"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "controlplane-core",
]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "httpx>=0.28.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.2.0",
    "respx>=0.22.0",
]

[tool.uv.sources]
controlplane-core = { workspace = true }

[tool.hatch.build.targets.wheel]
only-include = ["src/auth_service"]

[tool.hatch.build.targets.sdist]
include = ["src/auth_service"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Workspace packages: pytest resolves paths relative to this pyproject.toml.
pythonpath = [
    "src",
    "../lib/controlplane-core/src",
    "../lib/controlplane-db/src",
    "../events/src",
]
testpaths = ["tests"]
