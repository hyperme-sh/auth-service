[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "auth-service"
version = "0.2.0"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "controlplane-events @ git+https://github.com/hyperme-sh/controlplane-events.git@2a49f9af5f6c4dc9d6c4ddebc83c41d6331e2c87",
    "controlplane-tenancy @ git+https://github.com/hyperme-sh/controlplane-tenancy.git@00a2919115803ec01970dbbf0e7fb782e1ffd205",
    "controlplane-db @ git+https://github.com/hyperme-sh/controlplane-db.git@f078c7b2813cb264ecdcb22cf7672eeeb51cca4f",
    "controlplane-api @ git+https://github.com/hyperme-sh/controlplane-api.git@732256a5207ee502d7bf70cb171cf2eea1803b87",
    "controlplane-identity @ git+https://github.com/hyperme-sh/controlplane-identity.git@5aeff3d2c00568f39ca6e8b75c7e63883d3a510b",
    "httpx>=0.28.1",
    "redis>=5.0.0",
    "bcrypt>=4.2.0",
    "controlplane-core @ git+https://github.com/hyperme-sh/controlplane-core.git@62a85a064192080c37279fa4284b5bd273718c7c",
    "eth-account>=0.13.0",
    "eth-utils>=5.0.0",
]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "httpx>=0.28.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.2.0",
    "respx>=0.22.0",
    "testcontainers>=4.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/auth_service"]

[tool.hatch.build.targets.sdist]
include = ["/LICENSE", "/tests_artifacts", "/tests_tools", "/src", "/tests", "/scripts", "/pyproject.toml", "/uv.lock", "/README.md"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
