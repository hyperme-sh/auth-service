[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "auth-service"
version = "0.2.0"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "controlplane-events @ git+https://github.com/hyperme-sh/controlplane-events.git@41bac4f366eeeedae47a0ada18d89f3dee1ca608",
    "controlplane-tenancy @ git+https://github.com/hyperme-sh/controlplane-tenancy.git@c1f37025a93c8b4e38699a42665ce380a66a54fd",
    "controlplane-db @ git+https://github.com/hyperme-sh/controlplane-db.git@907b9390b3d68aa67903ffec849e9f1d64c17f1f",
    "controlplane-api @ git+https://github.com/hyperme-sh/controlplane-api.git@0813448d067d59a0cc8fa2d144d85ddfde465af4",
    "controlplane-identity @ git+https://github.com/hyperme-sh/controlplane-identity.git@5aeff3d2c00568f39ca6e8b75c7e63883d3a510b",
    "httpx>=0.28.1",
    "redis>=5.0.0",
    "bcrypt>=4.2.0",
    "controlplane-core @ git+https://github.com/hyperme-sh/controlplane-core.git@d5e658e1a139b58718a1dc1a5a532efd63d4f01c",
    "eth-account>=0.13.0",
    "eth-utils>=5.0.0",
]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "httpx>=0.28.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.2.0",
    "respx>=0.22.0",
    "testcontainers>=4.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/auth_service"]
# Owner migrations are an image-local bundle, not a transitive runtime dependency.
exclude = ["src/auth_service/migrations/**", "src/auth_service/migrate.py"]

[tool.hatch.build.targets.sdist]
include = ["/Dockerfile", "/.dockerignore", "/LICENSE", "/tests_artifacts", "/tests_tools", "/src", "/tests", "/scripts", "/pyproject.toml", "/uv.lock", "/README.md"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.uv]
override-dependencies = ["controlplane-events @ git+https://github.com/hyperme-sh/controlplane-events.git@41bac4f366eeeedae47a0ada18d89f3dee1ca608"]
