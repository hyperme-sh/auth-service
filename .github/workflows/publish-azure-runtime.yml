name: Publish the protected Auth runtime to Azure

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact authorized stable release tag
        required: true
        type: string
      registry:
        description: Azure release registry destination
        required: true
        default: shared
        type: choice
        options: [shared]

permissions: {}
concurrency:
  group: auth-azure-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    environment: auth-isolated-azure-release
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "linux", "x64", "debrunner"]') || 'ubuntu-24.04' }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION_TAG: ${{ inputs.version }}
    steps:
      - name: Scope the Azure CLI configuration to this job
        shell: bash
        run: printf 'AZURE_CONFIG_DIR=%s/auth-release-azure\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Bind the stable release to its original image and source
        id: release
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$VERSION_TAG")
          jq -e --arg tag "$VERSION_TAG" '.tag_name == $tag and .draft == false and .prerelease == false' <<<"$release" >/dev/null
          asset=$(jq -er '[.assets[] | select(.name == "runtime.json")] | select(length == 1) | .[0].digest' <<<"$release")
          [[ "$asset" =~ ^sha256:[a-f0-9]{64}$ ]]
          runtime=$(mktemp "$RUNNER_TEMP/auth-runtime.XXXXXX")
          trap 'rm -f -- "$runtime"' EXIT
          gh release download "$VERSION_TAG" --repo "$GITHUB_REPOSITORY" --pattern runtime.json --output "$runtime" --clobber
          printf '%s  %s\n' "${asset#sha256:}" "$runtime" | sha256sum -c -
          revision=$(gh api "repos/$GITHUB_REPOSITORY/commits/$VERSION_TAG" --jq .sha)
          [[ "$revision" =~ ^[a-f0-9]{40}$ ]]
          jq -e --arg version "$VERSION_TAG" --arg revision "$revision" '
            .schema_version == 1 and .version == $version and .revision == $revision and
            .repository == "ghcr.io/hyperme-sh/auth-service/runtime" and
            (.digest | test("^sha256:[a-f0-9]{64}$"))
          ' "$runtime" >/dev/null
          echo "digest=$(jq -er .digest "$runtime")" >> "$GITHUB_OUTPUT"

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Copy the qualified image without rebuilding and protect the tag
        env:
          DIGEST: ${{ steps.release.outputs.digest }}
          ACR_TENANT: ${{ vars.AZURE_TENANT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          registry=acrfybercg47
          server="$registry.azurecr.io"
          source="ghcr.io/hyperme-sh/auth-service/runtime"
          repository=auth-service
          target="$server/$repository:$VERSION_TAG"
          export DOCKER_CONFIG
          DOCKER_CONFIG=$(mktemp -d "$RUNNER_TEMP/auth-release-docker.XXXXXX")
          trap 'rm -rf -- "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          refresh=$(az account get-access-token --resource https://containerregistry.azure.net --query accessToken -o tsv |
            tr -d '\r\n' | curl -fsS --max-time 30 "https://$server/oauth2/exchange" \
              --data 'grant_type=access_token' --data-urlencode "tenant=$ACR_TENANT" \
              --data-urlencode "service=$server" --data-urlencode 'access_token@-' | jq -er .refresh_token)
          printf '%s' "$refresh" |
            docker login "$server" --username 00000000-0000-0000-0000-000000000000 --password-stdin
          metadata_token=$(printf '%s' "$refresh" | curl -fsS --max-time 30 "https://$server/oauth2/token" \
            --data 'grant_type=refresh_token' --data-urlencode "service=$server" \
            --data-urlencode "scope=repository:$repository:metadata_read,metadata_write" \
            --data-urlencode 'refresh_token@-' | jq -er .access_token)
          unset refresh
          metadata() {
            printf 'header = "Authorization: Bearer %s"\n' "$metadata_token" |
              curl -fsS --max-time 30 --config - "$@"
          }
          manifest_digest() {
            docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' | jq -er .digest
          }
          test "$(manifest_digest "$source:$VERSION_TAG")" = "$DIGEST"
          if docker manifest inspect "$target" >/dev/null 2>"$DOCKER_CONFIG/lookup.err"; then
            test "$(manifest_digest "$target")" = "$DIGEST"
          elif [[ "$(cat "$DOCKER_CONFIG/lookup.err")" == "no such manifest: $target" ||
                    "$(cat "$DOCKER_CONFIG/lookup.err")" == "manifest unknown" ]]; then
            docker buildx imagetools create --prefer-index=false --tag "$target" "$source@$DIGEST"
          else
            cat "$DOCKER_CONFIG/lookup.err" >&2
            exit 1
          fi
          test "$(manifest_digest "$target")" = "$DIGEST"
          tag_url="https://$server/acr/v1/$repository/_tags/$VERSION_TAG?api-version=2021-07-01"
          manifest_url="https://$server/acr/v1/$repository/_manifests/$DIGEST?api-version=2021-07-01"
          metadata "$tag_url" --request PATCH --header 'Content-Type: application/json' \
            --data '{"writeEnabled":false,"deleteEnabled":false}' >/dev/null
          metadata "$manifest_url" --request PATCH --header 'Content-Type: application/json' \
            --data '{"deleteEnabled":false}' >/dev/null
          metadata "$tag_url" | jq -e --arg digest "$DIGEST" '.tag | .digest == $digest and
            .changeableAttributes.writeEnabled == false and .changeableAttributes.deleteEnabled == false and
            .changeableAttributes.readEnabled == true' >/dev/null
          metadata "$manifest_url" | jq -e --arg digest "$DIGEST" '.manifest | .digest == $digest and
            .changeableAttributes.deleteEnabled == false and .changeableAttributes.readEnabled == true' >/dev/null
          unset metadata_token
          printf 'Protected %s at %s\n' "$target" "$DIGEST" | tee -a "$GITHUB_STEP_SUMMARY"
