name: Isolated consumer qualification
on:
  pull_request:
permissions:
  contents: read
jobs:
  package:
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "linux", "x64", "debrunner"]') || 'ubuntu-24.04' }}
    timeout-minutes: 25
    steps:
      - name: Prepare qualification outputs
        run: |
          echo "QUALIFICATION_VENV=$(mktemp -d "$RUNNER_TEMP/auth-venv.XXXXXX")" >> "$GITHUB_ENV"
          echo "RELEASE_ARTIFACT_DIR=$(mktemp -d "$RUNNER_TEMP/prepared-dist.XXXXXX")" >> "$GITHUB_ENV"
          echo "TEST_EVIDENCE_DIR=$(mktemp -d "$RUNNER_TEMP/prepared-tests.XXXXXX")" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.11.26'
          python-version: '3.13'
          enable-cache: false
      - name: Qualify package without inherited credentials
        run: >-
          bash scripts/anonymous-command.sh env
          UV_PROJECT_ENVIRONMENT="$QUALIFICATION_VENV"
          RELEASE_ARTIFACT_DIR="$RELEASE_ARTIFACT_DIR"
          TEST_EVIDENCE_DIR="$TEST_EVIDENCE_DIR" bash scripts/check-package.sh --fixtures
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: hyperme-sh/controlplane-sdk
          ref: 006611d80fe60b303288447204271cde5ba35332
          path: sdk-relay-source
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --prefix sdk-relay-source/packages/sea-device-link && npm run --prefix sdk-relay-source/packages/sea-device-link build
      - name: Packed browser relay and ASGI handler contracts
        run: node browser/sea-relay/check.mjs
        env:
          SDK_SOURCE: ${{ github.workspace }}/sdk-relay-source
          CONTRACT_PYTHON: ${{ env.QUALIFICATION_VENV }}/bin/python
      - name: Qualify standalone container with disposable issuer and database
        run: >-
          bash scripts/anonymous-command.sh env
          UV_PROJECT_ENVIRONMENT="$QUALIFICATION_VENV"
          RELEASE_ARTIFACT_DIR="$RELEASE_ARTIFACT_DIR"
          uv run --no-sync python scripts/check-container.py --evidence "$TEST_EVIDENCE_DIR/container.json"
      - name: Remove job-local qualification output
        if: always()
        run: rm -rf -- "$QUALIFICATION_VENV" "$RELEASE_ARTIFACT_DIR" "$TEST_EVIDENCE_DIR"
